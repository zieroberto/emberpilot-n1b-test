name: n1b-tests

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Dispatch id issued by the owner (n1t-<uuid v4>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: n1b-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: reviewed-sha
        id: reviewed
        env:
          REVIEWED_SHA: ${{ vars.REVIEWED_SHA }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then echo "gate=fail reason=REF_MISMATCH"; exit 1; fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$GITHUB_SHA" != "$REVIEWED_SHA" ]]; then echo "gate=fail reason=SHA_MISMATCH"; exit 1; fi
          if [[ ! "$DISPATCH_ID" =~ ^n1t-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then echo "gate=fail reason=DISPATCH_FORMAT"; exit 1; fi
          echo "gate=pass reason=OK"

      - name: checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: setup-node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: install
        id: install
        run: npm ci --ignore-scripts

      - name: offline-tests
        id: tests
        run: npm test
